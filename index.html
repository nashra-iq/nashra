<meta name="referrer" content="no-referrer"><!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بحث نشرات الشركات العراقية</title>
<style>body{font-family:Tahoma,Arial;max-width:900px;margin:20px auto;padding:0 12px;background:#f7f7f7}input{width:100%;font-size:20px;padding:10px}.r{background:#fff;margin:8px 0;padding:10px;border-radius:8px;border:1px solid #ddd}.m{color:#666;font-size:13px}.tw{overflow-x:auto;background:#fff;border:1px solid #ddd;border-radius:8px;margin:6px 0 14px}table{border-collapse:collapse;font-size:13px;min-width:100%}td,th{border:1px solid #e3e3e3;padding:5px;white-space:nowrap;vertical-align:top}th{background:#eef3f8;position:sticky;top:0}h3{margin:18px 0 6px}h4{margin:10px 0 2px}</style>
<h2>بحث في نشرات دائرة تسجيل الشركات العراقية</h2><p class="m"><span id="n">…</span> نشرة من 2018 حتى اليوم (نشرات 2018–مارس 2022 من أرشيف الإنترنت لأنها حُذفت من الموقع). اكتب اسم الشركة أو جزءًا منه.</p><p class="m" id="u"></p>
<input id="q" placeholder="اسم شركة أو اسم شخص..." autofocus disabled><p id="c" class="m"></p><h3>السجل الرسمي</h3><p class="m" id="rc">اكتب 3 أحرف على الأقل للبحث في سجل الشركات الرسمي (الملكية، التأسيس، العنوان).</p><div id="ro"></div><h3>النشرات</h3><div id="o"></div>
<script>const WORKER_URL="https://nashra-q.nashra-iq.workers.dev/";const TABS={national_page:"الشركات العراقية",public:"الشركات العامة",Archive:"المؤرشفة",forign_page:"الأجنبية",Tadamony:"التضامنية",simple:"البسيطة",individual_project:"المشروع الفردي",kurdar:"العراقية (كوردستان)",agency:"الوكالات",contributer:"المساهمون",kurd:"شركات كوردستان",name:"البحث بالاسم"};const B="https://tasjeel.mot.gov.iq/newtasjeel/";let D=[],I=[];
function N(s){return s.replace(/[إأآٱا]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ـ/g,"").replace(/[\u064b-\u0652\u0670]/g,"").replace(/لا/g,"ال").replace(/\s+/g," ")}
function E(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
c.textContent="جاري تحميل البيانات...";
fetch("data.json",{cache:"no-cache"}).then(r=>{const lm=r.headers.get("Last-Modified");if(lm)u.dataset.lm=new Date(lm).toLocaleString("ar",{timeZone:"Asia/Riyadh",dateStyle:"medium",timeStyle:"short"});return r.json()}).then(d=>{D=d;D.forEach(r=>r[3].forEach(l=>I.push([N(l),l,r])));n.textContent=D.length.toLocaleString("ar");q.disabled=false;u.textContent="آخر نشرة: "+(()=>{const Y=new Date().getFullYear();return D.map(r=>String(r[0]).split("-").map(Number)).filter(a=>a[0]>=2018&&a[0]<=Y&&a[1]&&a[2]).map(a=>[a[0]*1e4+a[1]*100+a[2],a[2]+"/"+a[1]+"/"+a[0]]).sort((a,b)=>a[0]-b[0]).pop()[1]})()+(u.dataset.lm?" — آخر تحديث للموقع: "+u.dataset.lm+" (بتوقيت مكة)":"");q.focus();c.textContent="";go();reg()}).catch(e=>c.textContent="تعذر تحميل البيانات، أعد تحميل الصفحة");
let t,t2,rq=0;q.oninput=()=>{clearTimeout(t);t=setTimeout(go,250);clearTimeout(t2);t2=setTimeout(reg,900)};
function reg(){const s=q.value.replace(/\s+/g," ").trim();const id=++rq;ro.innerHTML="";if(s.length<3){rc.textContent="اكتب 3 أحرف على الأقل للبحث في السجل الرسمي.";return}if(s.length>60){rc.textContent="النص طويل (الحد 60 حرف).";return}rc.textContent="جاري البحث في السجل الرسمي...";
fetch(WORKER_URL+"?page=all&q="+encodeURIComponent(s),{credentials:"omit",referrerPolicy:"no-referrer",cache:"default"}).then(r=>r.json()).then(j=>{if(id!==rq)return;if(j.error){rc.textContent="خطأ: "+j.error;return}let n=0,h="";for(const k of Object.keys(TABS)){const v=j[k];if(!v||v.error||!v.rows||!v.rows.length)continue;n+=v.total||v.rows.length;h+=`<h4>${E(TABS[k])} — ${E(String(v.total||v.rows.length))}${v.total>v.rows.length?" (أول "+v.rows.length+")":""}</h4><div class="tw"><table><tr>${(v.headers||[]).map(x=>`<th>${E(x)}</th>`).join("")}</tr>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${E(String(c))}</td>`).join("")}</tr>`).join("")}</table></div>`}rc.textContent=n?n+" نتيجة في السجل الرسمي":"لا نتائج في السجل الرسمي";ro.innerHTML=h}).catch(()=>{if(id===rq)rc.textContent="تعذر الوصول للسجل الرسمي"})}
function go(){const s=N(q.value.trim());o.innerHTML="";if(s.length<2){c.textContent="";return}
const h=I.filter(x=>x[0].includes(s)).reverse();c.textContent=h.length+" نتيجة";
o.innerHTML=h.slice(0,300).map(x=>`<div class="r">${E(x[1])}<div class="m">${E(x[2][0])} — العدد ${E(x[2][1]||"؟")} — <a target="_blank" rel="noopener noreferrer" href="${E(x[2][2].startsWith("http")?x[2][2]:B+x[2][2])}">افتح النشرة PDF</a></div></div>`).join("")}</script></html>
